[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharpedge-robinhood-bridge"
version = "0.1.0"
description = "Robinhood app-command logic, routing, and approval-gated execution planning for SharpEdge"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "kvandre12 + SharpEdge" }]
dependencies = []

[project.scripts]
sharpedge-robinhood-bridge = "sharpedge_robinhood_bridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
